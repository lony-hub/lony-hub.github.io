<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project | LONY Projects</title>
<style>
:root{
--bg-base:#07090e;--bg-surface:#0f141d;--bg-card:#141b26;--bg-card-hover:#1c2533;
--border-subtle:#212c3d;--text-main:#f8fafc;--text-muted:#94a3b8;
--neon-indigo:#6366f1;--neon-purple:#a855f7;--neon-cyan:#06b6d4;--neon-emerald:#10b981;--neon-amber:#f59e0b;
--radius-sm:10px;--radius-md:18px;--radius-lg:28px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg-base);color:var(--text-main);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.55;overflow-x:hidden;padding-bottom:84px;
background-image:radial-gradient(circle at 15% -5%,color-mix(in srgb,var(--neon-indigo) 22%,transparent),transparent 45%),radial-gradient(circle at 100% 10%,color-mix(in srgb,var(--neon-purple) 14%,transparent),transparent 40%);background-repeat:no-repeat}
a{color:inherit;text-decoration:none}
.wrap{max-width:860px;margin:0 auto;padding:0 16px}
section{margin-top:32px}
h2{font-size:1.25rem;font-weight:700;margin-bottom:14px;letter-spacing:-.01em}
.muted{color:var(--text-muted)}

/* LONY shine + glow */
.lony{font-weight:800;letter-spacing:.05em;background:linear-gradient(110deg,var(--neon-indigo),var(--neon-cyan),var(--text-main),var(--neon-purple),var(--neon-indigo));background-size:200% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;animation:lonyshine 3s linear infinite,lonyglow 2.4s ease-in-out infinite alternate}
@keyframes lonyshine{to{background-position:200% center}}
@keyframes lonyglow{from{filter:drop-shadow(0 0 3px color-mix(in srgb,var(--neon-cyan) 60%,transparent)) drop-shadow(0 0 8px color-mix(in srgb,var(--neon-indigo) 50%,transparent))}to{filter:drop-shadow(0 0 7px color-mix(in srgb,var(--neon-cyan) 90%,transparent)) drop-shadow(0 0 18px color-mix(in srgb,var(--neon-purple) 80%,transparent))}}
@media(prefers-reduced-motion:reduce){.lony{animation:none;filter:drop-shadow(0 0 6px color-mix(in srgb,var(--neon-cyan) 70%,transparent))}}

/* Navbar */
.nav{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg-base) 85%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--border-subtle)}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;height:58px;gap:10px}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:1.02rem;white-space:nowrap}
.logo b{display:grid;place-items:center;width:34px;height:34px;border-radius:var(--radius-sm);background:linear-gradient(135deg,var(--neon-indigo),var(--neon-purple));box-shadow:0 0 18px color-mix(in srgb,var(--neon-indigo) 55%,transparent);font-size:.95rem}
.back{font-size:.85rem;color:var(--text-muted);padding:8px 12px;border:1px solid var(--border-subtle);border-radius:999px;background:var(--bg-surface);transition:.25s}
.back:hover{color:var(--text-main);border-color:var(--neon-indigo);box-shadow:0 0 14px color-mix(in srgb,var(--neon-indigo) 40%,transparent)}

/* Hero */
.hero{margin-top:22px;padding:22px 18px;border-radius:var(--radius-lg);background:linear-gradient(160deg,var(--bg-card),var(--bg-surface));border:1px solid var(--border-subtle);box-shadow:0 0 50px color-mix(in srgb,var(--neon-indigo) 14%,transparent);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:180px;height:180px;border-radius:50%;background:color-mix(in srgb,var(--neon-cyan) 20%,transparent);filter:blur(50px);pointer-events:none}
.badges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;position:relative}
.badge{font-size:.78rem;font-weight:600;padding:5px 12px;border-radius:999px;border:1px solid}
.b-dept{color:var(--neon-cyan);border-color:color-mix(in srgb,var(--neon-cyan) 50%,transparent);background:color-mix(in srgb,var(--neon-cyan) 12%,transparent)}
.b-level{color:var(--neon-amber);border-color:color-mix(in srgb,var(--neon-amber) 50%,transparent);background:color-mix(in srgb,var(--neon-amber) 12%,transparent)}
h1{font-size:1.75rem;line-height:1.2;font-weight:800;letter-spacing:-.02em;margin-bottom:10px;position:relative;overflow-wrap:anywhere}
.hero p{color:var(--text-muted);font-size:.95rem;margin-bottom:18px;position:relative}
.price-row{display:flex;align-items:baseline;gap:10px;margin-bottom:16px;position:relative}
.price{font-size:2.1rem;font-weight:800;color:var(--neon-emerald);text-shadow:0 0 20px color-mix(in srgb,var(--neon-emerald) 50%,transparent)}
.cta{display:flex;flex-direction:column;gap:10px;position:relative}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;border-radius:var(--radius-md);font-weight:700;transition:.25s;text-align:center}
.btn-buy{padding:17px 20px;font-size:1.08rem;color:var(--text-main);background:linear-gradient(135deg,var(--neon-indigo),var(--neon-purple));box-shadow:0 0 28px color-mix(in srgb,var(--neon-purple) 45%,transparent)}
.btn-buy:hover{transform:translateY(-2px);box-shadow:0 0 42px color-mix(in srgb,var(--neon-purple) 65%,transparent)}
.btn-free{padding:11px 18px;font-size:.88rem;color:var(--neon-cyan);border:1px solid color-mix(in srgb,var(--neon-cyan) 50%,transparent);background:transparent}
.btn-free:hover{background:color-mix(in srgb,var(--neon-cyan) 12%,transparent);transform:translateY(-2px)}

/* Cards base */
.card{background:var(--bg-card);border:1px solid var(--border-subtle);border-radius:var(--radius-md);transition:.25s}
.card:hover{background:var(--bg-card-hover);border-color:color-mix(in srgb,var(--neon-indigo) 60%,var(--border-subtle));box-shadow:0 0 22px color-mix(in srgb,var(--neon-indigo) 22%,transparent)}

/* Quick info */
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.quick .card{padding:14px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.quick .ico{font-size:1.25rem}
.quick small{color:var(--text-muted);font-size:.75rem}
.quick strong{font-size:.98rem}

/* Learn */
.learn{list-style:none;display:grid;gap:10px}
.learn li{display:flex;gap:12px;align-items:flex-start;padding:13px 14px;font-size:.93rem}
.learn .i{flex:none;width:36px;height:36px;display:grid;place-items:center;border-radius:var(--radius-sm);background:color-mix(in srgb,var(--neon-indigo) 18%,transparent);font-size:1.1rem}

/* Components */
.comps{display:grid;gap:10px}
.comp{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:13px 14px;align-items:center}
.comp .n{font-weight:600;font-size:.94rem;min-width:0;overflow-wrap:anywhere}
.comp .p{color:var(--neon-amber);font-weight:700;text-align:right}
.comp .q{color:var(--text-muted);font-size:.8rem}
.comp .pa{color:var(--text-muted);font-size:.72rem;text-align:right}
.comp .ub{display:inline-block;margin-left:8px;padding:2px 8px;border-radius:999px;font-size:.7rem;font-weight:700;color:var(--neon-emerald);border:1px solid color-mix(in srgb,var(--neon-emerald) 50%,transparent);background:color-mix(in srgb,var(--neon-emerald) 10%,transparent)}

/* Steps */
.steps{display:grid;gap:10px}
.step{display:flex;gap:12px;padding:14px}
.num{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:.9rem;background:linear-gradient(135deg,var(--neon-indigo),var(--neon-purple));box-shadow:0 0 14px color-mix(in srgb,var(--neon-indigo) 50%,transparent)}
.step h3{font-size:.98rem;margin-bottom:3px}
.step p{font-size:.86rem;color:var(--text-muted)}
.step .tx{min-width:0}
.step.lock{opacity:.8}
.step.lock .num{background:var(--bg-surface);border:1px solid var(--border-subtle);box-shadow:none;font-size:1rem}
.step.lock p{filter:blur(4px);user-select:none}
.tag{display:inline-block;font-size:.68rem;font-weight:700;padding:2px 8px;border-radius:999px;margin-left:6px;vertical-align:middle}
.t-open{color:var(--neon-emerald);background:color-mix(in srgb,var(--neon-emerald) 14%,transparent)}
.t-lock{color:var(--neon-amber);background:color-mix(in srgb,var(--neon-amber) 14%,transparent)}

/* Included */
.inc{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.inc .card{padding:14px 12px;display:flex;gap:10px;align-items:center;min-width:0;font-size:.9rem;font-weight:600}
.inc .tick{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:.8rem;color:var(--bg-base);background:var(--neon-emerald);box-shadow:0 0 12px color-mix(in srgb,var(--neon-emerald) 55%,transparent)}

/* Viva */
.viva{display:grid;gap:10px}
.q{padding:14px;font-size:.92rem}
.q span{display:block;color:var(--neon-cyan);font-size:.76rem;font-weight:700;margin-bottom:3px}
.q.lock{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--text-muted)}
.q.lock div{filter:blur(3.5px);user-select:none;min-width:0}
.q.lock i{font-style:normal;font-size:1.1rem;flex:none}

/* Related */
.rel{display:grid;gap:10px}
.rel a{padding:14px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.rel b{display:block;font-size:.94rem;margin-bottom:4px}
.rel small{color:var(--text-muted)}
.rel em{font-style:normal;font-weight:700;color:var(--neon-emerald);flex:none}
.rel .l{min-width:0}

/* Departments */
.deps{display:grid;grid-template-columns:1fr;gap:10px}
.dep{padding:14px;display:block;min-width:0}
.dep header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.dep h3{font-size:1rem}
.dep .f{font-size:.68rem;font-weight:700;padding:2px 9px;border-radius:999px;color:var(--neon-emerald);background:color-mix(in srgb,var(--neon-emerald) 14%,transparent);white-space:nowrap}
.dep ul{list-style:none;display:grid;gap:5px}
.dep li{font-size:.84rem;color:var(--text-muted);padding-left:16px;position:relative;overflow-wrap:anywhere}
.dep li::before{content:"";position:absolute;left:2px;top:.55em;width:6px;height:6px;border-radius:50%;background:var(--neon-cyan);box-shadow:0 0 8px var(--neon-cyan)}
.dep h3{margin-bottom:10px}
.dep h4{font-size:.74rem;font-weight:700;margin:10px 0 6px}
.dep h4.free{color:var(--neon-emerald)}
.dep h4.paid{color:var(--neon-amber)}
.dep .pl li{display:flex;justify-content:space-between;gap:8px;padding-left:0}
.dep .pl li::before{display:none}
.dep .pl b{flex:none;color:var(--neon-amber);font-size:.78rem}
.dep .pd{margin-top:10px}
.dep summary{cursor:pointer;list-style:none;font-size:.8rem;font-weight:700;color:var(--neon-amber);padding:9px 12px;border-radius:var(--radius-sm);border:1px solid color-mix(in srgb,var(--neon-amber) 45%,transparent);background:color-mix(in srgb,var(--neon-amber) 10%,transparent);display:flex;justify-content:space-between;transition:.25s}
.dep summary::-webkit-details-marker{display:none}
.dep summary::after{content:"▾"}
.dep .pd[open] summary::after{content:"▴"}
.dep .pd .pl{margin-top:10px}
@media(min-width:600px){.deps{grid-template-columns:1fr 1fr}}
@media(min-width:769px){.deps{grid-template-columns:repeat(4,1fr)}}

.comp .buy{grid-column:1/-1;margin-top:6px;text-align:center;font-size:.8rem;font-weight:700;padding:8px 10px;border-radius:var(--radius-sm);color:var(--neon-amber);border:1px solid color-mix(in srgb,var(--neon-amber) 50%,transparent);background:color-mix(in srgb,var(--neon-amber) 10%,transparent);transition:.25s}
.comp .use{grid-column:1/-1;font-size:.8rem;color:var(--text-muted);line-height:1.5}
.comp .shops{grid-column:1/-1;display:flex;gap:8px;margin-top:6px}.comp .shops .buy{flex:1;margin-top:0;padding:8px 4px}
.comp .buy:hover{background:color-mix(in srgb,var(--neon-amber) 22%,transparent);box-shadow:0 0 14px color-mix(in srgb,var(--neon-amber) 35%,transparent)}
/* Footer */
footer{margin-top:40px;padding:26px 0;border-top:1px solid var(--border-subtle);background:var(--bg-surface);text-align:center;font-size:.82rem;color:var(--text-muted)}
footer strong{color:var(--text-main)}
footer p+p{margin-top:6px}

/* Sticky bar */
.bar{display:none}
@media(max-width:768px){
.bar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--bg-surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--border-subtle);box-shadow:0 -8px 30px color-mix(in srgb,var(--neon-indigo) 18%,transparent)}
.bar small{display:block;color:var(--text-muted);font-size:.7rem;line-height:1.1}
.bar strong{font-size:1.3rem;color:var(--neon-emerald)}
.bar .btn{padding:13px 26px;font-size:.98rem;background:linear-gradient(135deg,var(--neon-indigo),var(--neon-purple));box-shadow:0 0 22px color-mix(in srgb,var(--neon-purple) 45%,transparent)}
}
@media(min-width:600px){
.wrap{padding:0 24px}
h1{font-size:2.3rem}
.hero{padding:34px 32px}
.cta{flex-direction:row;align-items:center}
.btn-buy{padding:17px 34px}
.quick{grid-template-columns:repeat(4,1fr)}
.comps,.rel{grid-template-columns:1fr 1fr}
.inc{grid-template-columns:repeat(3,1fr)}
.rel{grid-template-columns:repeat(3,1fr)}
.rel a{flex-direction:column;align-items:flex-start}
}
@media(min-width:769px){body{padding-bottom:0}}
</style>

<script>
/* LONY UPI payment popup - change your UPI ID here only */
(function(){
  const UPI="lony-projects@ptyes";
  const K=k=>"lony_unlock_"+k;
  const has=k=>{try{return localStorage.getItem(K(k))==="1"}catch(e){return false}};
  let el,cur;
  function build(){
    const st=document.createElement("style");
    st.textContent=`#lp{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;z-index:500;padding:16px}#lp.on{display:flex}.lp-box{background:#0f141d;color:#f8fafc;border:1.5px solid #fbbf24;box-shadow:0 0 30px rgba(251,191,36,.4);border-radius:24px;padding:24px;max-width:380px;width:100%;position:relative;font-family:inherit}.lp-box h3{font-size:1.1rem;margin:0 0 4px;color:#fde047}.lp-box p{font-size:.85rem;color:#94a3b8;margin:0}.lp-price{font-size:2rem;font-weight:900;color:#fde047;margin:8px 0 10px}.lp-box ol{padding-left:18px;font-size:.85rem;color:#94a3b8;margin:0 0 14px}.lp-pay{display:block;text-align:center;text-decoration:none;font-weight:900;font-size:.9rem;padding:12px;border-radius:50px;background:linear-gradient(135deg,#fef08a,#f59e0b);color:#1a1204;margin-bottom:12px}.lp-in{width:100%;box-sizing:border-box;background:#141b26;border:1px solid #212c3d;color:#f8fafc;padding:11px 14px;border-radius:10px;font-size:.95rem;margin-bottom:10px}.lp-ok{width:100%;border:none;cursor:pointer;background:linear-gradient(135deg,#6366f1,#a855f7);color:#fff;font-weight:800;padding:12px;border-radius:50px;font-size:.9rem}.lp-x{position:absolute;top:10px;right:14px;background:none;border:none;color:#94a3b8;font-size:1.3rem;cursor:pointer}.lp-err{color:#f87171;font-size:.8rem;min-height:1.1em;margin-bottom:6px}`;
    document.head.appendChild(st);
    el=document.createElement("div");el.id="lp";
    el.innerHTML=`<div class="lp-box"><button type="button" class="lp-x" aria-label="Close">✕</button><h3 id="lp-t"></h3><p id="lp-s">Unlock this project</p><div class="lp-price" id="lp-p"></div><ol><li>Pay using UPI</li><li>Enter the 12 digit UTR / Transaction ID</li><li>Confirm to unlock</li></ol><a class="lp-pay" id="lp-a" href="#"></a><input class="lp-in" id="lp-u" inputmode="numeric" maxlength="12" placeholder="12 digit UTR number"><div class="lp-err" id="lp-e"></div><button type="button" class="lp-ok" id="lp-c">Confirm Payment &amp; Unlock</button><p style="margin-top:10px;font-size:.72rem">UPI ID: ${UPI}</p></div>`;
    document.body.appendChild(el);
    el.querySelector(".lp-x").onclick=()=>el.classList.remove("on");
    el.addEventListener("click",e=>{if(e.target===el)el.classList.remove("on")});
    el.querySelector("#lp-c").onclick=()=>{
      const v=el.querySelector("#lp-u").value.trim();
      if(!/^\d{12}$/.test(v)){el.querySelector("#lp-e").textContent="Enter a valid 12 digit UTR number";return}
      try{localStorage.setItem(K(cur.key),"1");localStorage.setItem("lony_utr_"+cur.key,v)}catch(e){}
      el.classList.remove("on");cur.cb&&cur.cb();
    };
  }
  function open(key,label,price,cb){
    if(!el)build();
    cur={key,cb};
    el.querySelector("#lp-t").textContent=label;
    el.querySelector("#lp-p").textContent="₹"+price;
    const a=el.querySelector("#lp-a");a.textContent="Pay ₹"+price+" with UPI";
    a.href="upi://pay?pa="+encodeURIComponent(UPI)+"&pn=LONY%20Projects&am="+price+"&cu=INR&tn="+encodeURIComponent(label.slice(0,40));
    el.querySelector("#lp-u").value="";el.querySelector("#lp-e").textContent="";
    el.classList.add("on");
  }
  window.LONYPAY={UPI,has,open};
})();

</script>

   ta:["இலக்கை புரிந்துகொள்ளுங்கள்: \"{T}\" என்ன செய்ய வேண்டும், யார் பயன்படுத்துவார்கள், முக்கிய அம்சங்கள் என்ன என்பதை எழுதுங்கள்.","கருவிகளை தயார் செய்யுங்கள்: VS Code மற்றும் browser நிறுவுங்கள் (தேவைப்பட்டால் Python அல்லது Node). ஒரு project folder உருவாக்குங்கள்.","திரைகளை வடிவமையுங்கள்: ஒவ்வொரு பக்கத்தையும் காகிதத்தில் வரைந்து, பின்னர் HTML CSS மூலம் layout உருவாக்குங்கள்.","செயல்பாட்டை சேருங்கள்: முக்கிய அம்சங்களுக்கு JavaScript அல்லது Python code எழுதுங்கள். ஒவ்வொன்றையும் தனித்தனியாக சோதியுங்கள்.","தரவை இணையுங்கள்: localStorage, database அல்லது API மூலம் தரவை சேமித்து எடுங்கள்.","சோதித்து சமர்ப்பியுங்கள்: பிழைகளை சரிசெய்து, screenshots எடுத்து, demo பதிவு செய்து, report மற்றும் PPT தயார் செய்யுங்கள்."]},
  elec:{
   en:["Understand the goal: Write what \"{T}\" must do and list the inputs (sensors, switches) and outputs (motors, lamps, display).","Collect components: Get the board (Arduino or ESP32), sensors, motor or relay, power supply, wires and a breadboard.","Draw the circuit: Draw the connection diagram first, then wire everything on the breadboard. Check power polarity twice.","Upload the code: Write or load the program in Arduino IDE and upload it. Test each sensor and output one by one.","Assemble the model: Fix all parts on a base or chassis, tidy the wires and test the full working.","Test and present: Record a demo video, note the readings and prepare your report, circuit diagram and PPT."],
   tg:["Goal purinjukonga: \"{T}\" ena panum nu eludhi, inputs (sensor, switch) and outputs (motor, lamp, display) list pannunga.","Components vaangunga: Board (Arduino illa ESP32), sensors, motor illa relay, power supply, wires, breadboard vaangunga.","Circuit varainga: Mudhala connection diagram varainju, apram breadboard la wiring pannunga. Power polarity rendu thadava check pannunga.","Code upload pannunga: Arduino IDE la program eludhi illa load panni upload pannunga. Ovvoru sensor um output um thaniya test pannunga.","Model assemble pannunga: Ella parts um base illa chassis la fix pannunga, wires ah neat ah vainga, full ah test pannunga.","Test panni present pannunga: Demo video record pannunga, readings note pannunga, report, circuit diagram, PPT ready pannunga."],
   ta:["இலக்கை புரிந்துகொள்ளுங்கள்: \"{T}\" என்ன செய்ய வேண்டும் என எழுதி, inputs (sensor, switch) மற்றும் outputs (motor, lamp, display) பட்டியலிடுங்கள்.","பாகங்களை சேகரியுங்கள்: Board (Arduino அல்லது ESP32), sensors, motor அல்லது relay, power supply, wires, breadboard வாங்குங்கள்.","சுற்றை வரையுங்கள்: முதலில் connection diagram வரைந்து, பின்னர் breadboard-ல் wiring செய்யுங்கள். Power polarity-ஐ இரண்டு முறை சரிபாருங்கள்.","Code upload செய்யுங்கள்: Arduino IDE-ல் program எழுதி அல்லது ஏற்றி upload செய்யுங்கள். ஒவ்வொரு sensor, output-ஐயும் தனித்தனியாக சோதியுங்கள்.","Model-ஐ இணையுங்கள்: எல்லா பாகங்களையும் base அல்லது chassis-ல் பொருத்தி, wires-ஐ சீராக்கி, முழுவதும் சோதியுங்கள்.","சோதித்து சமர்ப்பியுங்கள்: Demo video பதிவு செய்து, readings குறித்து, report, circuit diagram, PPT தயார் செய்யுங்கள்."]},
  mech:{
   en:["Understand the goal: Write what \"{T}\" must do and decide the size, load, speed and material needed.","Design and drawing: Make a sketch and a CAD drawing (AutoCAD or SolidWorks) with all dimensions. Prepare the bill of materials.","Buy materials: Collect the metal, motor, bearings, fasteners and other parts from your bill of materials.","Fabricate the parts: Cut, drill, weld or 3D print the parts in your workshop. Follow safety rules and wear PPE.","Assemble and test: Join all parts, add the motor or power source, then run trial tests and adjust.","Present: Record a demo video, note observations and results, and prepare your report, drawings and PPT."],
   tg:["Goal purinjukonga: \"{T}\" ena panum nu eludhi, size, load, speed, material enna venum nu mudivu pannunga.","Design and drawing: Sketch and CAD drawing (AutoCAD illa SolidWorks) dimensions oda ready pannunga. Bill of materials eludhunga.","Materials vaangunga: Bill of materials padi metal, motor, bearings, fasteners ellam collect pannunga.","Parts fabricate pannunga: Workshop la cut, drill, weld illa 3D print pannunga. Safety rules follow pannunga, PPE podunga.","Assemble panni test pannunga: Ella parts um join pannunga, motor illa power source add pannunga, trial test panni adjust pannunga.","Present pannunga: Demo video record pannunga, observations and results note pannunga, report, drawings, PPT ready pannunga."],
   ta:["இலக்கை புரிந்துகொள்ளுங்கள்: \"{T}\" என்ன செய்ய வேண்டும் என எழுதி, அளவு, சுமை, வேகம், பொருள் ஆகியவற்றை முடிவு செய்யுங்கள்.","வடிவமைப்பு மற்றும் வரைபடம்: அளவுகளுடன் sketch மற்றும் CAD drawing (AutoCAD அல்லது SolidWorks) தயார் செய்யுங்கள். Bill of materials எழுதுங்கள்.","பொருட்களை வாங்குங்கள்: Bill of materials படி உலோகம், motor, bearings, fasteners ஆகியவற்றை சேகரியுங்கள்.","பாகங்களை தயாரியுங்கள்: Workshop-ல் வெட்டி, துளையிட்டு, weld செய்து அல்லது 3D print செய்யுங்கள். பாதுகாப்பு விதிகளை பின்பற்றி PPE அணியுங்கள்.","இணைத்து சோதியுங்கள்: எல்லா பாகங்களையும் இணைத்து, motor அல்லது மின்சார மூலத்தை சேர்த்து, சோதனை ஓட்டம் செய்து சரிசெய்யுங்கள்.","சமர்ப்பியுங்கள்: Demo video பதிவு செய்து, அவதானிப்புகள், முடிவுகளை குறித்து, report, drawings, PPT தயார் செய்யுங்கள்."]}

  const EXTRA={
  soft:{
   en:["Test checklist: Test every page and button, wrong inputs, an empty form and a small phone screen. Tick each item in a list.","Fix common problems: Open the browser console (F12) and read the errors. Fix one error at a time and test again after each change.","Improve it: Add a better design, validation messages and loading or error messages. Keep a backup copy of the working code.","Demo and viva: Practise a 2 minute demo. Be ready to explain the idea, the tools used, how data flows and one future improvement."],
   tg:["Test checklist: Ovvoru page, button, thappana input, empty form, chinna phone screen ellam test pannunga. List la tick pannunga.","Common problems fix pannunga: Browser console (F12) open panni error padinga. Oru time ku oru error fix panni, ovvoru maatrathukum apram thirumba test pannunga.","Improve pannunga: Nalla design, validation messages, loading and error messages add pannunga. Working code ku backup copy vachukonga.","Demo and viva: 2 minute demo practice pannunga. Idea, tools, data eppadi pogum, oru future improvement ellam solla ready ah irunga."],
   ta:["சோதனை பட்டியல்: ஒவ்வொரு பக்கம், button, தவறான உள்ளீடு, காலி form, சிறிய phone திரை ஆகியவற்றை சோதியுங்கள். பட்டியலில் tick செய்யுங்கள்.","பொதுவான பிழைகளை சரிசெய்யுங்கள்: Browser console (F12) திறந்து பிழைகளை படியுங்கள். ஒரு நேரத்தில் ஒன்றை சரிசெய்து, ஒவ்வொரு மாற்றத்திற்கும் பின் மீண்டும் சோதியுங்கள்.","மேம்படுத்துங்கள்: சிறந்த வடிவமைப்பு, validation செய்திகள், loading மற்றும் error செய்திகளை சேருங்கள். வேலை செய்யும் code-இன் backup வைத்திருங்கள்.","Demo மற்றும் viva: 2 நிமிட demo பயிற்சி செய்யுங்கள். யோசனை, கருவிகள், தரவு ஓட்டம், எதிர்கால மேம்பாடு ஆகியவற்றை விளக்க தயாராக இருங்கள்."]},
  elec:{
   en:["Test checklist: Check the supply voltage with a multimeter, read every sensor value in Serial Monitor and run the full project for 10 minutes.","Fix common problems: If nothing works, check power first, then ground, then wiring, then code. Change only one thing at a time.","Improve it: Replace loose breadboard wires with soldering or a PCB, add a box or case and label every wire and part.","Demo and viva: Practise a 2 minute demo. Be ready to explain every component, the circuit working and the code logic."],
   tg:["Test checklist: Multimeter la supply voltage check pannunga, Serial Monitor la ovvoru sensor value um paarunga, full project ah 10 minute odavidunga.","Common problems fix pannunga: Edhuvum work aagala na mudhala power, apram ground, apram wiring, kadaisila code check pannunga. Oru time ku oru vishayam mattum maathunga.","Improve pannunga: Loose breadboard wires ku badhila soldering illa PCB use pannunga, box add pannunga, ovvoru wire um part um label pannunga.","Demo and viva: 2 minute demo practice pannunga. Ovvoru component, circuit working, code logic ellam solla ready ah irunga."],
   ta:["சோதனை பட்டியல்: Multimeter-ல் மின்னழுத்தம் பாருங்கள், Serial Monitor-ல் ஒவ்வொரு sensor மதிப்பையும் படியுங்கள், முழு project-ஐ 10 நிமிடம் ஓட்டுங்கள்.","பொதுவான பிழைகளை சரிசெய்யுங்கள்: எதுவும் வேலை செய்யவில்லை என்றால் முதலில் power, பின்னர் ground, wiring, கடைசியாக code சரிபாருங்கள். ஒரு நேரத்தில் ஒன்றை மட்டும் மாற்றுங்கள்.","மேம்படுத்துங்கள்: தளர்வான breadboard wires-க்கு பதிலாக soldering அல்லது PCB பயன்படுத்துங்கள், பெட்டி சேருங்கள், ஒவ்வொரு wire மற்றும் பாகத்தையும் label செய்யுங்கள்.","Demo மற்றும் viva: 2 நிமிட demo பயிற்சி செய்யுங்கள். ஒவ்வொரு பாகம், சுற்றின் செயல்பாடு, code logic ஆகியவற்றை விளக்க தயாராக இருங்கள்."]},
  mech:{
   en:["Test checklist: Check alignment, tight bolts, smooth rotation and load handling. Run a no-load trial before a loaded trial.","Fix common problems: For noise or wobble, check alignment and lubrication. For no movement, check power, coupling and any jammed part.","Improve it: Paint the model, add guards and labels, and note the cost and weight of the final model.","Demo and viva: Practise a 2 minute demo. Be ready to explain the design choice, material, calculations and safety."],
   tg:["Test checklist: Alignment, bolts tight ah, rotation smooth ah, load handle aagudha nu check pannunga. Load podura munnadi no-load trial odunga.","Common problems fix pannunga: Sound illa wobble na alignment and lubrication check pannunga. Move aagala na power, coupling, jam aana part check pannunga.","Improve pannunga: Model ku paint adinga, guards and labels add pannunga, final model oda cost and weight note pannunga.","Demo and viva: 2 minute demo practice pannunga. Design choice, material, calculations, safety ellam solla ready ah irunga."],
   ta:["சோதனை பட்டியல்: நேர்கோடு, இறுக்கமான bolts, சீரான சுழற்சி, சுமை தாங்கும் திறன் ஆகியவற்றை சரிபாருங்கள். சுமை இல்லாமல் முதலில் சோதனை ஓட்டம் செய்யுங்கள்.","பொதுவான பிழைகளை சரிசெய்யுங்கள்: சத்தம் அல்லது ஆட்டம் இருந்தால் alignment மற்றும் lubrication பாருங்கள். இயக்கம் இல்லை என்றால் power, coupling, சிக்கிய பாகத்தை பாருங்கள்.","மேம்படுத்துங்கள்: Model-க்கு வண்ணம் பூசி, guards மற்றும் labels சேருங்கள், இறுதி model-இன் செலவு மற்றும் எடையை குறியுங்கள்.","Demo மற்றும் viva: 2 நிமிட demo பயிற்சி செய்யுங்கள். வடிவமைப்பு தேர்வு, பொருள், கணக்கீடுகள், பாதுகாப்பு ஆகியவற்றை விளக்க தயாராக இருங்கள்."]}

  const FIXH={en:"If something goes wrong",tg:"Edhavadhu fault vandha",ta:"ஏதேனும் பிழை வந்தால்"};
  const MOD={
  iot:{en:["Board not detected: Use a data USB cable (not charge-only), select the right board and COM port in Arduino IDE, and hold the BOOT button while uploading.","Wi-Fi not connecting: Use a 2.4 GHz network only, check the SSID and password spelling and keep the board near the router."],
   tg:["Board detect aagala: Data USB cable use pannunga (charge-only vendam), Arduino IDE la correct board and COM port select pannunga, upload ku BOOT button pidichukonga.","Wi-Fi connect aagala: 2.4 GHz network mattum use pannunga, SSID password spelling check pannunga, board ah router pakkathula vainga."],
   ta:["Board கண்டறியப்படவில்லை: Data USB cable பயன்படுத்துங்கள் (charge-only வேண்டாம்), Arduino IDE-ல் சரியான board மற்றும் COM port தேர்வு செய்யுங்கள், upload செய்யும்போது BOOT button அழுத்தி பிடியுங்கள்.","Wi-Fi இணையவில்லை: 2.4 GHz network மட்டும் பயன்படுத்துங்கள், SSID மற்றும் password எழுத்துப்பிழை பாருங்கள், board-ஐ router அருகில் வையுங்கள்."]},
  sensor:{en:["Sensor gives wrong or zero values: Check VCC and GND, confirm the signal pin number in code and add a short delay between readings.","Relay or board keeps resetting: Use a separate power supply for the load and join all the grounds together."],
   tg:["Sensor wrong illa zero value tharudhu: VCC GND check pannunga, code la signal pin number correct ah nu paarunga, readings ku naduvula chinna delay add pannunga.","Relay illa board thirumba thirumba reset aagudhu: Load ku thaniya power supply use pannunga, ella ground um onnaa connect pannunga."],
   ta:["Sensor தவறான அல்லது பூஜ்ய மதிப்பு தருகிறது: VCC, GND பாருங்கள், code-ல் signal pin எண் சரியா என சோதியுங்கள், அளவீடுகளுக்கு இடையே சிறிய delay சேருங்கள்.","Relay அல்லது board மீண்டும் மீண்டும் reset ஆகிறது: Load-க்கு தனி power supply பயன்படுத்துங்கள், எல்லா ground-களையும் ஒன்றாக இணையுங்கள்."]},
  motor:{en:["Motor does not move or jitters: Use a motor driver (L298N or similar), power it from a separate battery and share the ground with the board.","Servo shakes: Give it its own 5V supply, add a 470 µF capacitor and do not move it beyond its range."],
   tg:["Motor move aagala illa jitter aagudhu: Motor driver (L298N madhiri) use pannunga, thaniya battery la power kudunga, board oda ground share pannunga.","Servo nadukkudhu: Adhukku thaniya 5V supply kudunga, 470 µF capacitor add pannunga, range thaandi move pannadheenga."],
   ta:["Motor நகரவில்லை அல்லது நடுங்குகிறது: Motor driver (L298N போன்றது) பயன்படுத்துங்கள், தனி battery-யில் இயக்குங்கள், board-உடன் ground பகிருங்கள்.","Servo நடுங்குகிறது: அதற்கு தனி 5V supply கொடுங்கள், 470 µF capacitor சேருங்கள், அதன் எல்லையை தாண்டி நகர்த்தாதீர்கள்."]},
  power:{en:["Low output voltage: Check the panel or source angle, loose joints and battery level. Measure with a multimeter at each stage.","Battery heats or drains fast: Disconnect immediately, check for a short circuit and use a proper charging module."],
   tg:["Output voltage kammi: Panel illa source angle, loose joints, battery level check pannunga. Ovvoru stage layum multimeter la measure pannunga.","Battery sooda aagudhu illa vegama theerudhu: Udane disconnect pannunga, short circuit check pannunga, sariyana charging module use pannunga."],
   ta:["வெளியீட்டு மின்னழுத்தம் குறைவு: Panel அல்லது மூலத்தின் கோணம், தளர்வான இணைப்புகள், battery அளவை சரிபாருங்கள். ஒவ்வொரு நிலையிலும் multimeter-ல் அளவிடுங்கள்.","Battery சூடாகிறது அல்லது விரைவில் தீர்கிறது: உடனே துண்டியுங்கள், short circuit சோதியுங்கள், சரியான charging module பயன்படுத்துங்கள்."]},

  web:{en:["Page blank or button not working: Open the console (F12), read the red error and check file names and spelling.","Data disappears after refresh: Save it with localStorage or a database after every change and check the key name."],

   ta:["Page வெறுமையாக உள்ளது அல்லது button வேலை செய்யவில்லை: Console (F12) திறந்து சிவப்பு பிழையை படியுங்கள், கோப்பு பெயர்கள் மற்றும் எழுத்துப்பிழையை சரிபாருங்கள்.","Refresh செய்தால் data போகிறது: ஒவ்வொரு மாற்றத்திற்கும் பின் localStorage அல்லது database-ல் சேமியுங்கள், key பெயரை சரிபாருங்கள்."]},

  }
  document.addEventListener("click",e=>{
    const b=e.target.closest(".g-lang button,.g-dev button");if(!b)return;

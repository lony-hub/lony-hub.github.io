<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project Details | LONY Projects</title>
<style>
:root{
  --bg-base:#07090e;--bg-surface:#0f141d;--bg-card:#141b26;--bg-card-hover:#1c2533;
  --border-subtle:#212c3d;--text-main:#f8fafc;--text-muted:#94a3b8;
  --neon-indigo:#6366f1;--neon-purple:#a855f7;--neon-cyan:#06b6d4;--neon-emerald:#10b981;--neon-amber:#f59e0b;
  --radius-sm:10px;--radius-md:18px;--radius-lg:28px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg-base);color:var(--text-main);font-family:system-ui,-apple-system,sans-serif;line-height:1.55;padding-bottom:84px;}
a{color:inherit;text-decoration:none}
.wrap{max-width:860px;margin:0 auto;padding:0 16px}
section{margin-top:32px}
h2{font-size:1.25rem;font-weight:700;margin-bottom:14px}
.muted{color:var(--text-muted)}

/* Navbar */
.nav{position:sticky;top:0;z-index:20;background:rgba(15,20,29,0.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--border-subtle)}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;height:58px}
.logo{font-weight:800;font-size:1.02rem}
.back{font-size:.85rem;color:var(--text-muted);padding:8px 12px;border:1px solid var(--border-subtle);border-radius:999px;background:var(--bg-surface)}

/* Hero Details */
.hero{margin-top:22px;padding:22px 18px;border-radius:var(--radius-lg);background:linear-gradient(160deg,var(--bg-card),var(--bg-surface));border:1px solid var(--border-subtle)}
.badges{display:flex;gap:8px;margin-bottom:14px}
.badge{font-size:.78rem;font-weight:600;padding:5px 12px;border-radius:999px;border:1px solid}
.b-dept{color:var(--neon-cyan);border-color:rgba(6,182,212,0.4);background:rgba(6,182,212,0.1)}
.b-level{color:var(--neon-amber);border-color:rgba(245,158,11,0.4);background:rgba(245,158,11,0.1)}
h1{font-size:1.75rem;font-weight:800;margin-bottom:10px}
.price{font-size:2.1rem;font-weight:800;color:var(--neon-emerald)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:var(--radius-md);font-weight:700;padding:14px 24px;text-align:center}
.btn-buy{color:var(--text-main);background:linear-gradient(135deg,var(--neon-indigo),var(--neon-purple))}

/* Cards */
.card{background:var(--bg-card);border:1px solid var(--border-subtle);border-radius:var(--radius-md);padding:14px;margin-bottom:10px}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.quick small{color:var(--text-muted);font-size:.75rem}
.quick strong{font-size:.98rem;display:block}

/* 360 Viewer */
.v360{position:relative;border-radius:var(--radius-md);background:var(--bg-card);border:1px solid var(--border-subtle);aspect-ratio:4/3;display:flex;align-items:center;justify-content:center}
.v360 .none{text-align:center;color:var(--text-muted)}

footer{margin-top:40px;padding:26px 0;border-top:1px solid var(--border-subtle);text-align:center;font-size:.82rem;color:var(--text-muted)}
</style>
</head>
<body>
<header class="nav"><div class="wrap"><a class="logo" href="index.html"><b>LONY</b> Projects</a><a class="back" href="index.html">← All Projects</a></div></header>
<main class="wrap" id="app"></main>
<footer><div class="wrap"><p>© 2026 LONY Projects. All rights reserved.</p></div></footer>

<script>
const P=[
  {b:"eee",t:"Automatic Night Lamp using LDR",l:"Beginner",d:"Lamp turns on in the dark by itself.",p:0},
  {b:"robo",t:"Bluetooth Controlled Car",l:"Intermediate",d:"Drive the car from a phone app.",p:150}
];

const t=new URLSearchParams(location.search).get("t");
const x=P.find(p=>p.t===t)||P[0];
document.title=x.t+" | LONY Projects";

document.getElementById("app").innerHTML= `
  <div class="hero">
    <div class="badges">
      <span class="badge b-dept">${x.b.toUpperCase()}</span>
      <span class="badge b-level">${x.l}</span>
    </div>
    <h1>${x.t}</h1>
    <p>${x.d}</p>
    <br>
    <div class="price">${x.p ? '₹' + x.p : 'Free'}</div>
    <br>
    <a class="btn btn-buy" href="#">${x.p ? 'Buy Full Project' : 'Download Free'}</a>
  </div>

  <section>
    <h2>360° View Output</h2>
    <div class="v360"><div class="none"><b>360 View</b><br>Interactive view loaded for hardware model</div></div>
  </section>

  <section>
    <h2>Quick Overview</h2>
    <div class="quick">
      <div class="card"><small>Department</small><strong>${x.b.toUpperCase()}</strong></div>
      <div class="card"><small>Level</small><strong>${x.l}</strong></div>
    </div>
  </section>
`;
</script>
</body>
</html>

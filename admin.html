<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - LONY Projects</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#07090e">
<script>try{var _t=localStorage.getItem("lony_theme");if(_t)document.documentElement.setAttribute("data-theme",_t)}catch(e){}</script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
:root{--bg-base:#07090e;--bg-surface:#0f141d;--bg-card:#141b26;--bg-card-hover:#1c2533;--border-subtle:#212c3d;--text-main:#f8fafc;--text-muted:#94a3b8;--neon-indigo:#6366f1;--neon-purple:#a855f7;--neon-cyan:#06b6d4}
:root{--a-rgb:99,102,241;--b-rgb:168,85,247;--c-rgb:6,182,212;--a-soft:#818cf8;--a-deep:#4f46e5}
html[data-theme="indigo"]{--bg-base:#07090e;--bg-surface:#0f141d;--bg-card:#141b26;--bg-card-hover:#1c2533;--border-subtle:#212c3d;--neon-indigo:#6366f1;--neon-purple:#a855f7;--neon-cyan:#06b6d4;--a-rgb:99,102,241;--b-rgb:168,85,247;--c-rgb:6,182,212;--a-soft:#818cf8;--a-deep:#4f46e5}
html[data-theme="cyber"]{--bg-base:#050810;--bg-surface:#0b111c;--bg-card:#0f1726;--bg-card-hover:#162238;--border-subtle:#1c2b45;--neon-indigo:#00e5ff;--neon-purple:#ff2bd6;--neon-cyan:#00ffa3;--a-rgb:0,229,255;--b-rgb:255,43,214;--c-rgb:0,255,163;--a-soft:#5eead4;--a-deep:#0891b2}
html[data-theme="emerald"]{--bg-base:#040d0a;--bg-surface:#0a1612;--bg-card:#0e1d18;--bg-card-hover:#15291f;--border-subtle:#1a3328;--neon-indigo:#10b981;--neon-purple:#84cc16;--neon-cyan:#22d3ee;--a-rgb:16,185,129;--b-rgb:132,204,22;--c-rgb:34,211,238;--a-soft:#34d399;--a-deep:#059669}
html[data-theme="sunset"]{--bg-base:#0f0705;--bg-surface:#1a0f0b;--bg-card:#211410;--bg-card-hover:#2d1c15;--border-subtle:#3a2419;--neon-indigo:#f97316;--neon-purple:#ef4444;--neon-cyan:#facc15;--a-rgb:249,115,22;--b-rgb:239,68,68;--c-rgb:250,204,21;--a-soft:#fb923c;--a-deep:#ea580c}
html[data-theme="gold"]{--bg-base:#0b0905;--bg-surface:#16120a;--bg-card:#1d170d;--bg-card-hover:#292012;--border-subtle:#3a2e17;--neon-indigo:#f59e0b;--neon-purple:#fde047;--neon-cyan:#fb923c;--a-rgb:245,158,11;--b-rgb:253,224,71;--c-rgb:251,146,60;--a-soft:#fbbf24;--a-deep:#d97706}
html[data-theme="ocean"]{--bg-base:#040e14;--bg-surface:#09161e;--bg-card:#0d1e29;--bg-card-hover:#142c3a;--border-subtle:#1a3a4c;--neon-indigo:#0ea5e9;--neon-purple:#06b6d4;--neon-cyan:#2dd4bf;--a-rgb:14,165,233;--b-rgb:6,182,212;--c-rgb:45,212,191;--a-soft:#38bdf8;--a-deep:#0284c7}
html[data-theme="rose"]{--bg-base:#0e050b;--bg-surface:#190b14;--bg-card:#20101a;--bg-card-hover:#2d1625;--border-subtle:#3b1e30;--neon-indigo:#ec4899;--neon-purple:#a855f7;--neon-cyan:#fb7185;--a-rgb:236,72,153;--b-rgb:168,85,247;--c-rgb:251,113,133;--a-soft:#f472b6;--a-deep:#db2777}
body{min-height:100vh;background:var(--bg-base);color:var(--text-main);line-height:1.6;-webkit-font-smoothing:antialiased;background-image:radial-gradient(520px 320px at 85% 0,rgba(var(--a-rgb),.16),transparent 70%);background-repeat:no-repeat}
a{color:inherit;text-decoration:none}
.bar{position:sticky;top:0;z-index:10;background:rgba(15,20,29,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--border-subtle);padding:12px 16px}
.bar-in{max-width:1000px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;letter-spacing:-.4px}
.badge{background:linear-gradient(135deg,var(--neon-indigo),var(--neon-purple));color:#fff;padding:4px 10px;border-radius:10px;font-size:.75rem;font-weight:900}
.me{display:flex;align-items:center;gap:10px}
.me img{width:30px;height:30px;border-radius:50%;border:1px solid var(--border-subtle)}
.btn{font:inherit;font-size:.82rem;font-weight:700;cursor:pointer;border-radius:50px;padding:7px 14px;border:1px solid rgba(var(--a-rgb),.45);background:rgba(var(--a-rgb),.12);color:var(--a-soft)}
.btn:hover{background:rgba(var(--a-rgb),.22)}
.btn:focus-visible{outline:2px solid var(--a-soft);outline-offset:2px}
.wrap{max-width:1000px;margin:0 auto;padding:28px 16px 60px}
h1{font-size:1.6rem;font-weight:800;letter-spacing:-.5px}
.lead{color:var(--text-muted);font-size:.9rem;margin:2px 0 22px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:26px}
.stat{background:var(--bg-card);border:1px solid var(--border-subtle);border-radius:18px;padding:16px}
.stat b{display:block;font-size:1.7rem;font-weight:800;line-height:1.2}
.stat span{font-size:.8rem;color:var(--text-muted)}
.panel{background:var(--bg-card);border:1px solid var(--border-subtle);border-radius:20px;overflow:hidden;margin-bottom:22px}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border-subtle)}
.panel-h h2{font-size:1.02rem;font-weight:800}
.search{background:var(--bg-base);border:1px solid var(--border-subtle);color:var(--text-main);border-radius:50px;padding:7px 14px;font-size:.85rem;width:min(220px,50%)}
.search:focus{outline:2px solid var(--a-soft);outline-offset:1px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:520px}
th,td{text-align:left;padding:11px 16px;font-size:.86rem;border-bottom:1px solid var(--border-subtle);white-space:nowrap}
th{color:var(--text-muted);font-weight:700;font-size:.78rem}
tr:last-child td{border-bottom:none}
.u{display:flex;align-items:center;gap:10px}
.u img{width:28px;height:28px;border-radius:50%}
.tag{font-size:.7rem;font-weight:800;padding:2px 9px;border-radius:50px;background:rgba(16,185,129,.15);color:#34d399;border:1px solid rgba(16,185,129,.4)}
.empty{padding:28px 16px;text-align:center;color:var(--text-muted);font-size:.88rem}
.links{display:flex;flex-wrap:wrap;gap:10px;padding:16px}
.gate{min-height:70vh;display:flex;align-items:center;justify-content:center;padding:20px;text-align:center}
.gate div{max-width:380px}
.gate h1{font-size:1.3rem;margin-bottom:8px}
.gate p{color:var(--text-muted);font-size:.9rem;margin-bottom:16px}
.err{color:#f87171}
.pst{font-size:.7rem;font-weight:800;padding:2px 9px;border-radius:50px;border:1px solid}
.pst.pending{background:rgba(245,158,11,.15);color:#fbbf24;border-color:rgba(245,158,11,.4)}
.pst.approved{background:rgba(16,185,129,.15);color:#34d399;border-color:rgba(16,185,129,.4)}
.pst.rejected{background:rgba(248,113,113,.15);color:#f87171;border-color:rgba(248,113,113,.4)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--border-subtle)}
.tabs .btn.on{background:rgba(var(--a-rgb),.35)}
.btn.ok{border-color:rgba(16,185,129,.5);color:#34d399;background:rgba(16,185,129,.12)}
.btn.no{border-color:rgba(248,113,113,.5);color:#f87171;background:rgba(248,113,113,.1)}
.btn:disabled{opacity:.5;cursor:default}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace}
[hidden]{display:none!important}
</style>
</head>
<body>

<div class="gate" id="gate" role="status" aria-live="polite">
  <div>
    <h1 id="gt">Checking access...</h1>
    <p id="gp"></p>
    <span id="gb"></span>
  </div>
</div>

<div id="app" hidden>
  <header class="bar">
    <div class="bar-in">
      <a class="brand" href="index.html"><span class="badge">LONY</span> Admin</a>
      <div class="me">
        <img id="aimg" alt="" referrerpolicy="no-referrer" hidden>
        <span id="amail" style="font-size:.82rem;color:var(--text-muted)"></span>
        <button class="btn" id="alogout" type="button">Logout</button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <h1>Admin panel</h1>
    <p class="lead" id="hello"></p>

    <div class="stats">
      <div class="stat"><b id="s-total">-</b><span>Registered users</span></div>
      <div class="stat"><b id="s-today">-</b><span>Active today</span></div>
      <div class="stat"><b id="s-new">-</b><span>Joined last 7 days</span></div>
      <div class="stat"><b id="s-pend">-</b><span>Pending payments</span></div>
    </div>

    <section class="panel" aria-labelledby="ph">
      <div class="panel-h"><h2 id="ph">Payments (UTR)</h2><button class="btn" id="prefresh" type="button">Refresh</button></div>
      <div class="tabs" id="ptabs">
        <button class="btn on" data-f="pending" type="button">Pending</button>
        <button class="btn" data-f="approved" type="button">Approved</button>
        <button class="btn" data-f="rejected" type="button">Rejected</button>
        <button class="btn" data-f="all" type="button">All</button>
      </div>
      <div class="scroll">
        <table>
          <thead><tr><th>Date</th><th>User email</th><th>Item</th><th>Amount</th><th>UTR</th><th>Status</th><th>Action</th></tr></thead>
          <tbody id="prows"></tbody>
        </table>
      </div>
      <div class="empty" id="pempty" hidden></div>
    </section>

    <section class="panel" aria-labelledby="uh">
      <div class="panel-h">
        <h2 id="uh">Users</h2>
        <input class="search" id="q" type="search" placeholder="Search name or email" aria-label="Search users">
      </div>
      <div class="scroll">
        <table>
          <thead><tr><th>User</th><th>Email</th><th>Joined</th><th>Last login</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <div class="empty" id="uempty" hidden></div>
    </section>

    <section class="panel" aria-labelledby="qh">
      <div class="panel-h"><h2 id="qh">Quick links</h2></div>
      <div class="links">
        <a class="btn" href="index.html">View site</a>
        <a class="btn" href="runner.html">Code Runner</a>
        <a class="btn" href="videos.js">videos.js</a>
        <a class="btn" href="pay.js">pay.js (UPI ID)</a>
      </div>
    </section>
  </main>
</div>

<script type="module">
import { configured, onUser, isAdminUser, logout, listUsers, listPayments, approvePayment, rejectPayment, friendlyError } from "./auth.js";

const $ = (id) => document.getElementById(id);
let all = [];

function gate(title, text, action) {
  $("app").hidden = true; $("gate").hidden = false;
  $("gt").textContent = title; $("gp").textContent = text;
  const gb = $("gb"); gb.textContent = "";
  (action || []).forEach((a) => {
    const el = document.createElement(a.href ? "a" : "button");
    el.className = "btn"; el.textContent = a.label; el.style.marginRight = "8px";
    if (a.href) el.href = a.href; else { el.type = "button"; el.onclick = a.fn; }
    gb.appendChild(el);
  });
}

const ts = (v) => (v && v.toDate ? v.toDate() : null);
const fmt = (d) => d ? d.toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" }) : "-";

function draw(list) {
  const tb = $("rows"); tb.textContent = "";
  list.forEach((u) => {
    const tr = document.createElement("tr");
    const c1 = document.createElement("td");
    const wrap = document.createElement("div"); wrap.className = "u";
    if (u.photo) { const i = document.createElement("img"); i.src = u.photo; i.alt = ""; i.referrerPolicy = "no-referrer"; wrap.appendChild(i); }
    wrap.appendChild(document.createTextNode(u.name || "No name"));
    c1.appendChild(wrap);
    const c2 = document.createElement("td"); c2.textContent = u.email || "-";
    const c3 = document.createElement("td"); c3.textContent = fmt(ts(u.createdAt));
    const c4 = document.createElement("td"); c4.textContent = fmt(ts(u.lastLogin));
    tr.append(c1, c2, c3, c4); tb.appendChild(tr);
  });
  const e = $("uempty");
  e.hidden = list.length > 0;
  if (!list.length) e.textContent = all.length ? "No user matches your search." : "No users yet. They show up here after the first Google sign in.";
}

function stats() {
  const day = 864e5, now = Date.now();
  $("s-total").textContent = all.length;
  $("s-today").textContent = all.filter((u) => ts(u.lastLogin) && now - ts(u.lastLogin) < day).length;
  $("s-new").textContent = all.filter((u) => ts(u.createdAt) && now - ts(u.createdAt) < 7 * day).length;
}


let pays = [], pf = "pending";
const itemName = (k) => String(k).replace(/^p_/, "").replace(/^prem_/, "Premium pack: ");
const fmtT = (d) => d ? d.toLocaleString(undefined, { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) : "-";

function drawPays() {
  const list = pf === "all" ? pays : pays.filter((p) => p.status === pf);
  const tb = $("prows"); tb.textContent = "";
  list.forEach((p) => {
    const tr = document.createElement("tr");
    const cell = (t, cls) => { const td = document.createElement("td"); td.textContent = t; if (cls) td.className = cls; return td; };
    tr.append(cell(fmtT(ts(p.createdAt))), cell(p.email || "-"), cell(itemName(p.key)), cell("₹" + p.amount), cell(p.id, "mono"));
    const st = document.createElement("td");
    const tag = document.createElement("span"); tag.className = "pst " + p.status; tag.textContent = p.status;
    st.appendChild(tag); tr.appendChild(st);
    const act = document.createElement("td");
    if (p.status === "pending") {
      const ok = document.createElement("button"); ok.className = "btn ok"; ok.type = "button"; ok.textContent = "Approve";
      const no = document.createElement("button"); no.className = "btn no"; no.type = "button"; no.textContent = "Reject"; no.style.marginLeft = "6px";
      ok.onclick = async () => {
        if (!confirm("Bank la UTR " + p.id + " / ₹" + p.amount + " vandhucha? Approve pannalaama?")) return;
        ok.disabled = no.disabled = true;
        try { await approvePayment(p); p.status = "approved"; drawPays(); pstats(); }
        catch (e) { alert(friendlyError(e)); ok.disabled = no.disabled = false; }
      };
      no.onclick = async () => {
        if (!confirm("Reject pannalaama? UTR " + p.id)) return;
        ok.disabled = no.disabled = true;
        try { await rejectPayment(p); p.status = "rejected"; drawPays(); pstats(); }
        catch (e) { alert(friendlyError(e)); ok.disabled = no.disabled = false; }
      };
      act.append(ok, no);
    } else act.textContent = "-";
    tr.appendChild(act); tb.appendChild(tr);
  });
  const e = $("pempty"); e.hidden = list.length > 0;
  if (!list.length) e.textContent = "No " + (pf === "all" ? "" : pf + " ") + "payments.";
}
function pstats() { $("s-pend").textContent = pays.filter((p) => p.status === "pending").length; }
async function loadPays() {
  try { pays = await listPayments(); pstats(); drawPays(); }
  catch (e) { $("pempty").hidden = false; $("pempty").className = "empty err"; $("pempty").textContent = friendlyError(e) + " Firestore rules check pannunga."; }
}
$("ptabs").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-f]"); if (!b) return;
  pf = b.dataset.f;
  document.querySelectorAll("#ptabs .btn").forEach((x) => x.classList.toggle("on", x === b));
  drawPays();
});
$("prefresh").onclick = loadPays;

async function load() {
  loadPays();
  try {
    all = await listUsers();
    stats(); draw(all);
  } catch (e) {
    $("uempty").hidden = false;
    $("uempty").className = "empty err";
    $("uempty").textContent = friendlyError(e) + " Firestore rules check pannunga (FIREBASE_SETUP.md).";
  }
}

$("q").addEventListener("input", (e) => {
  const v = e.target.value.trim().toLowerCase();
  draw(!v ? all : all.filter((u) => (u.name || "").toLowerCase().includes(v) || (u.email || "").toLowerCase().includes(v)));
});
$("alogout").onclick = async () => { await logout(); location.href = "login.html?mode=admin"; };

if (!configured) {
  gate("Firebase setup pending", "auth.js la FIREBASE_CONFIG fill pannunga. Steps FIREBASE_SETUP.md la irukku.", [{ label: "Back to site", href: "index.html" }]);
} else {
  let started = false;
  onUser((u) => {
    if (!u) {
      gate("Admin login required", "Admin Google account la sign in pannunga.", [{ label: "Admin login", href: "login.html?mode=admin&next=admin.html" }]);
      return;
    }
    if (!isAdminUser(u)) {
      gate("Access denied", (u.email || "This account") + " admin list la illa.", [
        { label: "Switch account", fn: async () => { await logout(); location.href = "login.html?mode=admin&next=admin.html"; } },
        { label: "Back to site", href: "index.html" }
      ]);
      return;
    }
    $("gate").hidden = true; $("app").hidden = false;
    $("hello").textContent = "Welcome, " + (u.displayName || "Admin") + ".";
    $("amail").textContent = u.email;
    if (u.photoURL) { $("aimg").src = u.photoURL; $("aimg").hidden = false; }
    if (!started) { started = true; load(); }
  });
}
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LONY Projects - Code Runner</title>
<style>
:root{--bg:#0f172a;--card:#1e293b;--acc:#22c55e;--tx:#e2e8f0;--mu:#94a3b8}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--tx)}
header{padding:14px 16px;background:var(--card);display:flex;align-items:center;justify-content:space-between}
header h1{font-size:18px;margin:0}header span{color:var(--acc)}
main{padding:12px;max-width:900px;margin:auto}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px}
.tab{flex:0 0 auto;padding:10px 16px;border-radius:20px;border:1px solid #334155;background:var(--card);color:var(--tx);font-size:15px;cursor:pointer}
.tab.on{background:var(--acc);color:#052e16;font-weight:700;border-color:var(--acc)}
textarea{width:100%;background:#0b1220;color:#e2e8f0;border:1px solid #334155;border-radius:10px;padding:10px;font:14px/1.5 ui-monospace,monospace;tab-size:2;resize:vertical}
#code{height:250px}
.row{display:flex;gap:8px;margin:10px 0}
button.act{flex:1;padding:14px;border:0;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer}
#run{background:var(--acc);color:#052e16}
#clr{background:#334155;color:var(--tx);flex:0 0 90px}
#prev{width:100%;height:320px;border:1px solid #334155;border-radius:10px;background:#fff}
</style>
</head>
<body>
<header><h1>LONY <span>Projects</span> • Code Runner</h1><a href="index.html" style="color:var(--acc);font-size:14px">← Home</a></header>
<main>
<div class="tabs" id="tabs">
  <button class="tab on" onclick="load('html')">HTML/CSS/JS</button>
  <button class="tab" onclick="load('js')">JavaScript</button>
</div>
<br>
<textarea id="code" spellcheck="false"></textarea>
<div class="row">
  <button class="act" id="run">▶ Run</button>
  <button class="act" id="clr">Clear</button>
</div>
<label style="color:var(--mu);font-size:13px">Output Preview</label>
<br><br>
<iframe id="prev" sandbox="allow-scripts allow-modals"></iframe>
</main>

<script>
const S={
html:`<!DOCTYPE html>
<html>
<head>
<style>
  body{font-family:sans-serif;text-align:center;padding-top:30px}
  h1{color:teal}
</style>
</head>
<body>
  <h1>Hello LONY 👋</h1>
  <button onclick="alert('Working fine!')">Click Me</button>
</body>
</html>`,
js:`console.log("Hello from JavaScript Code Runner!");`
};

const code=document.getElementById("code");
const prev=document.getElementById("prev");

function load(l){
  code.value=S[l]||"";
}

document.getElementById("run").onclick=()=>{
  prev.srcdoc=code.value;
};

document.getElementById("clr").onclick=()=>{
  code.value="";
  prev.srcdoc="";
};

load('html');
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="lony-extras.js"></script>
<title>Payment not verified | LONY Projects</title>
<meta name="robots" content="noindex">
<style>
:root{--bg-base:#07090e;--bg-surface:#0f141d;--bg-card:#141b26;--border-subtle:#212c3d;--text-main:#f8fafc;--text-muted:#94a3b8;--neon-indigo:#6366f1;--neon-purple:#a855f7;--neon-cyan:#06b6d4;--red:#f87171;--green:#34d399;--amber:#fbbf24}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg-base);color:var(--text-main);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.55;overflow-x:hidden;min-height:100vh;background-image:radial-gradient(circle at 15% -5%,rgba(99,102,241,.22),transparent 45%),radial-gradient(circle at 100% 10%,rgba(168,85,247,.14),transparent 40%);background-repeat:no-repeat}
a{color:inherit;text-decoration:none}
.wrap{max-width:620px;margin:0 auto;padding:0 16px}
.nav{background:rgba(15,20,29,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--border-subtle);position:sticky;top:0;z-index:50}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;min-height:58px;gap:10px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700}
.logo b{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,var(--neon-indigo),var(--neon-purple));color:#fff}
.lony{font-weight:800;letter-spacing:.05em;background:linear-gradient(110deg,var(--neon-indigo),var(--neon-cyan),#fff,var(--neon-purple),var(--neon-indigo));background-size:200% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:sh 3s linear infinite}
@keyframes sh{to{background-position:200% center}}
.back{font-size:.8rem;font-weight:700;border:1px solid var(--border-subtle);border-radius:50px;padding:7px 14px;background:var(--bg-card)}
main{padding:26px 0 10px}
.card{background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:24px;padding:24px 20px;box-shadow:0 20px 60px rgba(0,0,0,.45);animation:up .4s ease both}
@keyframes up{from{opacity:0;transform:translateY(12px)}}
.ic{width:68px;height:68px;border-radius:50%;display:grid;place-items:center;font-size:2rem;margin:0 auto 14px}
.ic.bad{background:rgba(248,113,113,.14);border:1px solid rgba(248,113,113,.5);box-shadow:0 0 30px rgba(248,113,113,.25)}
.ic.ok{background:rgba(52,211,153,.14);border:1px solid rgba(52,211,153,.5)}
.ic.wait{background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.5)}
h1{font-size:1.35rem;text-align:center;letter-spacing:-.01em}
.lead{text-align:center;color:var(--text-muted);font-size:.9rem;margin:8px 0 18px}
.ver{display:flex;justify-content:center;margin-bottom:16px}
.ver span{font-size:.72rem;font-weight:800;color:var(--green);border:1px solid rgba(52,211,153,.45);background:rgba(52,211,153,.1);border-radius:50px;padding:4px 12px}
dl{background:var(--bg-card);border:1px solid var(--border-subtle);border-radius:16px;padding:6px 14px;margin-bottom:16px}
dl div{display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px solid var(--border-subtle);font-size:.86rem}
dl div:last-child{border:none}
dt{color:var(--text-muted);flex:none}dd{text-align:right;font-weight:700;word-break:break-word}
dd.bad{color:var(--red)}dd.copy{font-variant-numeric:tabular-nums}
.help{font-size:.8rem;color:var(--text-muted);background:rgba(251,191,36,.07);border:1px solid rgba(251,191,36,.3);border-radius:14px;padding:10px 12px;margin-bottom:16px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{flex:1 1 180px;min-height:48px;border-radius:50px;border:1px solid var(--border-subtle);background:var(--bg-card);color:var(--text-main);font:800 .9rem system-ui,sans-serif;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;text-align:center;padding:0 16px}
.btn.pri{border:none;background:linear-gradient(135deg,var(--neon-indigo),var(--neon-purple));color:#fff;box-shadow:0 8px 24px rgba(99,102,241,.35)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn:focus-visible,.copyb:focus-visible{outline:2px solid #fde047;outline-offset:2px}
.copyb{background:none;border:none;color:#a5b4fc;font:700 .75rem system-ui;cursor:pointer;text-decoration:underline;margin-left:6px}
.msg{min-height:1.2em;font-size:.82rem;text-align:center;margin-top:12px;color:var(--amber)}
details{margin-top:18px;background:var(--bg-card);border:1px solid var(--border-subtle);border-radius:14px;padding:10px 14px;font-size:.82rem}
summary{cursor:pointer;font-weight:700}details li{list-style:none;padding:6px 0;border-top:1px solid var(--border-subtle);margin-top:6px;color:var(--text-muted)}
.sk{height:16px;border-radius:8px;background:linear-gradient(90deg,#141b26,#1c2533,#141b26);background-size:200% 100%;animation:sk 1.2s linear infinite;margin:12px 0}
@keyframes sk{to{background-position:-200% 0}}
footer{text-align:center;color:var(--text-muted);font-size:.78rem;padding:26px 16px 30px}
@media(prefers-reduced-motion:reduce){.card,.lony,.sk{animation:none}}
</style>
</head>
<body>
<header class="nav"><div class="wrap"><a class="logo" href="index.html"><b>L</b><span><span class="lony">LONY</span> Projects</span></a><a class="back" href="index.html">← Home</a></div></header>
<main class="wrap"><div id="app" class="card" aria-live="polite"><div class="sk"></div><div class="sk" style="width:70%"></div><div class="sk" style="width:85%"></div></div></main>
<footer><div class="wrap"><p>© 2026 <span class="lony">LONY</span> Projects</p></div></footer>

<script type="module">
import { configured, onUser, getMyPayments, getMyUnlocks, slug } from "./auth.js";

const app = document.getElementById("app");
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const when = p => p.createdAt && p.createdAt.seconds ? new Date(p.createdAt.seconds * 1000).toLocaleString("en-IN", { dateStyle: "medium", timeStyle: "short" }) : "—";
const label = k => /^p_/.test(k) ? { name: k.slice(2), kind: "Project pack" } : /^prem_/.test(k) ? { name: "Premium Future Projects (" + k.slice(5).toUpperCase() + ")", kind: "Premium pack" } : { name: k, kind: "Purchase" };
const target = k => /^p_/.test(k) ? "project.html?t=" + encodeURIComponent(k.slice(2)) + "&retry=1" : /^prem_/.test(k) ? "index.html?retry=" + encodeURIComponent(k) : "index.html";
const qs = new URLSearchParams(location.search);

function show(html) { app.innerHTML = html; }
function home(extra) { return '<div class="row">' + (extra || "") + '<a class="btn" href="index.html">Back to Home</a></div>'; }
function offlineCard() {
  show('<div class="ic wait">📡</div><h1>Could not check your payment</h1><p class="lead">We could not reach LONY right now, so we cannot confirm anything yet. Check your internet and try again.</p><div class="row"><button class="btn pri" id="re">Retry Connection</button><a class="btn" href="index.html">Back to Home</a></div>');
  document.getElementById("re").onclick = () => location.reload();
}

function failedCard(p, others) {
  const l = label(p.key);
  show(
    '<div class="ic bad" aria-hidden="true">✕</div><h1>Payment not verified</h1>' +
    '<p class="lead">We checked this UPI payment and could not confirm it, so <b>' + esc(l.name) + '</b> is still locked.</p>' +
    '<div class="ver"><span>✔ Status read from LONY payment records</span></div>' +
    '<dl><div><dt>Item</dt><dd>' + esc(l.name) + '</dd></div><div><dt>Amount</dt><dd>₹' + esc(p.amount) + '</dd></div>' +
    '<div><dt>UTR / Reference</dt><dd class="copy"><span id="utr">' + esc(p.utr || p.id) + '</span><button type="button" class="copyb" id="cp">Copy</button></dd></div>' +
    '<div><dt>Submitted</dt><dd>' + esc(when(p)) + '</dd></div><div><dt>Status</dt><dd class="bad">Rejected after verification</dd></div></dl>' +
    '<div class="help">If money was deducted from your account, keep the UTR above and check with your bank or UPI app. When you retry, pay again and enter the <b>new</b> 12 digit UTR. A UTR that was already submitted cannot be used again.</div>' +
    '<div class="row"><button class="btn pri" id="retry">Retry Payment</button><a class="btn" href="index.html">Back to Home</a></div><div class="msg" id="msg" role="status"></div>' +
    (others.length ? '<details><summary>Earlier payments that were not verified (' + others.length + ')</summary><ul>' + others.slice(0, 5).map(o => '<li>' + esc(label(o.key).name) + ' · ₹' + esc(o.amount) + ' · ' + esc(when(o)) + '</li>').join("") + '</ul></details>' : "")
  );
  document.getElementById("cp").onclick = async e => {
    try { await navigator.clipboard.writeText(p.utr || p.id); e.target.textContent = "Copied"; } catch (x) { e.target.textContent = "Select & copy"; }
  };
  const btn = document.getElementById("retry"), msg = document.getElementById("msg");
  let busy = false;
  btn.onclick = async () => {
    if (busy) return;                                   /* blocks double taps */
    busy = true; btn.disabled = true; msg.textContent = "Checking your latest payment status…";
    try {
      const u = window.__u;
      const [pays, unl] = await Promise.all([getMyPayments(u.uid), getMyUnlocks(u.uid)]);
      const sl = slug(p.key);
      if (unl.includes(sl) || pays.some(x => slug(x.key) === sl && x.status === "approved")) { msg.textContent = "This item is already unlocked. No new payment is needed."; btn.textContent = "Already unlocked"; return; }
      if (pays.some(x => slug(x.key) === sl && x.status === "pending")) { msg.textContent = "A payment for this item is already under verification. Please wait for it to finish."; btn.textContent = "Payment under verification"; return; }
      location.href = target(p.key);
    } catch (e) { msg.textContent = "Could not check right now. Please try again."; busy = false; btn.disabled = false; }
  };
}

function infoCard(kind, icon, title, text, extra) {
  show('<div class="ic ' + kind + '" aria-hidden="true">' + icon + '</div><h1>' + esc(title) + '</h1><p class="lead">' + text + '</p>' + home(extra));
}

async function run(u) {
  try {
    const [pays, unl] = await Promise.all([getMyPayments(u.uid), getMyUnlocks(u.uid)]);
    const unlocked = new Set(unl);
    const asked = (qs.get("utr") || "").replace(/\D/g, "");
    /* Only records that really belong to this signed-in user are ever shown. The URL is just a lookup hint. */
    let focus = asked ? pays.find(p => p.id === asked) : null;
    const pendKeys = new Set(pays.filter(p => p.status === "pending").map(p => slug(p.key)));
    const rejected = pays.filter(p => p.status === "rejected" && !unlocked.has(slug(p.key)) && !pendKeys.has(slug(p.key)));   /* a newer pending payment replaces the failure */
    if (focus && focus.status !== "rejected") {
      if (focus.status === "pending") return infoCard("wait", "⏳", "Payment is being verified", "This payment is <b>not failed</b>. It is waiting for admin verification and will unlock automatically once approved.");
      if (focus.status === "approved") return infoCard("ok", "✓", "Payment verified", "This payment was verified and your item is unlocked.", '<a class="btn pri" href="myprojects.html">My Projects</a>');
    }
    if (focus && focus.status === "rejected" && unlocked.has(slug(focus.key))) return infoCard("ok", "✓", "Already unlocked", "A later payment for this item was approved, so you have access.", '<a class="btn pri" href="myprojects.html">My Projects</a>');
    const main = (focus && focus.status === "rejected") ? focus : rejected[0];
    if (main) return failedCard(main, rejected.filter(p => p.id !== main.id));
    const pend = pays.filter(p => p.status === "pending");
    if (pend.length) return infoCard("wait", "⏳", "Nothing has failed", "You have " + pend.length + " payment" + (pend.length > 1 ? "s" : "") + " waiting for verification. This page only shows payments that were actually rejected.");
    infoCard("ok", "✓", "No failed payment found", "We could not find any rejected payment on your account. This page only shows results read from LONY payment records.");
  } catch (e) {
    offlineCard();
  }
}

if (!configured) {
  infoCard("wait", "⚙", "Payment check unavailable", "The payment service is not set up on this site yet.");
} else {
  let started = false;
  onUser(u => {
    if (!u) {
      const here = "payment-failed.html" + location.search;
      location.replace("login.html?next=" + encodeURIComponent(here));
      return;
    }
    window.__u = u;
    if (started) return; started = true;
    run(u);
  });
}
</script>
</body>
</html>
